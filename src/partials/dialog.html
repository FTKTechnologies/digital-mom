  <dialog id="contact-dialog" aria-labelledby="contact-title" aria-describedby="contact-intro">
    <button class="modal-close" type="button" aria-label="Close contact form">×</button>
    <h2 id="contact-title">Tell us about<br><em>your business.</em></h2>
    <p id="contact-intro">A little about you. A little about what you need. We’ll take it from there.</p>
    <form id="contact-form" action="/contact.php" method="post" data-contact-form>
      <label for="contact-name">Your name</label>
      <input id="contact-name" name="name" autocomplete="name" required minlength="2" maxlength="100">
      <label for="contact-email">Your email</label>
      <input id="contact-email" name="email" type="email" autocomplete="email" required maxlength="254">
      <label for="contact-message">How can we help?</label>
      <textarea id="contact-message" name="message" rows="4" required minlength="10" maxlength="3000"></textarea>
      <div class="honey" aria-hidden="true"><label for="contact-website">Leave this field empty</label><input id="contact-website" name="website" tabindex="-1" autocomplete="off"></div>
      <input type="hidden" name="token">
      <p class="form-note">We’ll use your details to reply to your enquiry. Please leave out passwords and sensitive information. <a href="/privacy/">Privacy policy</a></p>
      <p class="form-status" role="status" aria-live="polite" data-form-status></p>
      <button class="btn form-submit" type="submit" disabled>Send message <span class="arrow" aria-hidden="true">↗</span></button>
    </form>
  </dialog>
